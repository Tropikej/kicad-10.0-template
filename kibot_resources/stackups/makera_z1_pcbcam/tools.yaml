# Tool library: the cutters on the bench.
#
# Units are in the field names: mm, mm/min, rpm, degrees. `number` is the
# M6 T<number> tool number shown at each tool change (the Z1 changes tools by
# hand, so it is a label: keep it stuck on the bit's box). T0 is the probe.
#
# Feeds and speeds are STARTING POINTS for FR4, not validated settings.

tools:
  # Dreanique 3.175 mm shank, 20 deg included angle, 0.1 mm tip.
  # Cut width = 0.1 + 2 x depth x tan(10 deg) = 0.1 + 0.353 x depth:
  #   0.05 deep -> 0.118   0.08 deep -> 0.128   0.10 deep -> 0.135
  vbit_20_0.1:
    type: vbit
    number: 1
    description: Dreanique 3.175 20deg 0.1
    angle_deg: 20
    tip_diameter_mm: 0.1
    # After the calibration cut, replace the formula with measured grooves
    # (measure the GAP ladder under a loupe), e.g.:
    # calibration:
    #   - {depth_mm: 0.05, width_mm: 0.13}
    #   - {depth_mm: 0.10, width_mm: 0.16}
    # 2026-10-24: tip broke a few seconds into the first cut at 120 / 30 mm/min
    # (tool length 0.964 -> 0.777 mm). Retry slower, after checking runout.
    rpm: 12000
    feed_mm_min: 60
    plunge_mm_min: 15

  # Dreanique 3.175 mm shank, 20 deg, 0.2 mm tip: sturdier, for wide gaps.
  #   0.05 deep -> 0.218   0.08 deep -> 0.228   0.10 deep -> 0.235
  vbit_20_0.2:
    type: vbit
    number: 2
    description: Dreanique 3.175 20deg 0.2
    angle_deg: 20
    tip_diameter_mm: 0.2
    rpm: 12000
    feed_mm_min: 60  # very gentle: last bit of this size; raise once it cuts cleanly
    plunge_mm_min: 10

  # The 0.1 mm bit after its tip broke (2026-10-24): tool length 0.964 -> 0.777,
  # 0.187 mm shorter, so the flat end is about 0.1 + 2 x 0.187 x tan(10 deg)
  # = 0.166 mm. A break is not a clean grind: cut the GAP ladder once, measure
  # the grooves and replace this estimate with calibration points.
  vbit_20_0.17_broken:
    type: vbit
    number: 3
    description: Dreanique 3.175 20deg 0.1, broken tip (est. 0.166 flat)
    angle_deg: 20
    tip_diameter_mm: 0.166
    # calibration:
    #   - {depth_mm: 0.08, width_mm: ...}
    rpm: 12000
    feed_mm_min: 60
    plunge_mm_min: 10

  # PCB drill set 0.3 - 1.2 mm. The small ones break easily: slow plunge.
  drill_0.3: {type: drill, number: 10, diameter_mm: 0.3, rpm: 12000, plunge_mm_min: 20}
  drill_0.4: {type: drill, number: 11, diameter_mm: 0.4, rpm: 12000, plunge_mm_min: 25}
  drill_0.5: {type: drill, number: 12, diameter_mm: 0.5, rpm: 12000, plunge_mm_min: 30}
  drill_0.6: {type: drill, number: 13, diameter_mm: 0.6, rpm: 12000, plunge_mm_min: 40}
  drill_0.7: {type: drill, number: 14, diameter_mm: 0.7, rpm: 12000, plunge_mm_min: 40}
  drill_0.8: {type: drill, number: 15, diameter_mm: 0.8, rpm: 12000, plunge_mm_min: 50}
  drill_0.9: {type: drill, number: 16, diameter_mm: 0.9, rpm: 12000, plunge_mm_min: 50}
  drill_1.0: {type: drill, number: 17, diameter_mm: 1.0, rpm: 12000, plunge_mm_min: 60}
  drill_1.1: {type: drill, number: 18, diameter_mm: 1.1, rpm: 12000, plunge_mm_min: 60}
  drill_1.2: {type: drill, number: 19, diameter_mm: 1.2, rpm: 12000, plunge_mm_min: 60}

  # board outline need a flat end mill / corn bit; put the one you own here.
  endmill_2.0:
    type: endmill
    number: 20
    description: 2.0mm single flute carbide endmill
    diameter_mm: 2.0
    rpm: 12000
    feed_mm_min: 200
    plunge_mm_min: 60
