# JLCPCB 6 layers, 1.6 mm, stackup JLC06161H-3313
# 1 oz outer copper, 0.5 oz inner copper
# https://jlcpcb.com/impedance
# Apply with: ./run_kibot.sh --stackup jlcpcb_6l

name: JLC06161H-3313
description: JLCPCB 6 layers 1.6 mm, 3313/2116 prepreg
copper_finish: HAL lead-free
mask_color: Green
silk_color: White
mask_thickness: 0.01
mask_epsilon_r: 3.8

# Top to bottom. Copper layers: user name and KiCad type (signal, power, mixed, jumper)
layers:
  - {copper: "L1 (Sig)", type: signal, thickness: 0.035}
  - {dielectric: prepreg, material: "3313", thickness: 0.0994, epsilon_r: 4.1, loss_tangent: 0.02}
  - {copper: "L2 (GND)", type: power, thickness: 0.0152}
  - {dielectric: core, material: FR4, thickness: 0.55, epsilon_r: 4.6, loss_tangent: 0.02}
  - {copper: "L3 (Sig)", type: signal, thickness: 0.0152}
  - {dielectric: prepreg, material: "2116", thickness: 0.1088, epsilon_r: 4.16, loss_tangent: 0.02}
  - {copper: "L4 (PWR)", type: power, thickness: 0.0152}
  - {dielectric: core, material: FR4, thickness: 0.55, epsilon_r: 4.6, loss_tangent: 0.02}
  - {copper: "L5 (GND)", type: power, thickness: 0.0152}
  - {dielectric: prepreg, material: "3313", thickness: 0.0994, epsilon_r: 4.1, loss_tangent: 0.02}
  - {copper: "L6 (Sig)", type: signal, thickness: 0.035}

# Impedance table of the fabrication document (written to
# kibot_resources/templates/impedance_table.txt by --stackup).
# Values from the JLCPCB impedance calculator for JLC06161H-3313, outer layers
# referenced to the adjacent plane: https://jlcpcb.com/pcb-impedance-calculator
impedance:
  - {line: Coated Microstrip, impedance: 50, tolerance: "±10 %", layer: L1 / L6, width: 0.1509, gap: "-", ref: L2 / L5}
  - {line: Edge-Coupled Coated Microstrip, impedance: 90, tolerance: "±10 %", layer: L1 / L6, width: 0.1537, gap: 0.2032, ref: L2 / L5}
  - {line: Edge-Coupled Coated Microstrip, impedance: 100, tolerance: "±10 %", layer: L1 / L6, width: 0.1191, gap: 0.2032, ref: L2 / L5}
