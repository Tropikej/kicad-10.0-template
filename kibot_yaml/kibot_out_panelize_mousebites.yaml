# KiBot output: panel of the board with KiKit (mousebites), for JLCPCB
# Mouse bites: any board shape, 2 mm routed gaps (@PANEL_SPACE@ mm)
# https://kibot.readthedocs.io/en/latest/configuration/outputs/panelize.html
# https://yaqwsx.github.io/KiKit/latest/panelization/cli/

kibot:
  version: 1

outputs:
- name: @NAME@
  comment: '@COMMENT@'
  type: panelize
  category: '@DIR@'
  dir: '@DIR@'
  options:
    output: '%f-panel.%x'
    create_preview: true
    configs:
    - name: 'jlcpcb_mousebites'
      layout:
        type: grid
        rows: @PANEL_ROWS@
        cols: @PANEL_COLS@
        space: @PANEL_SPACE@
      tabs:
        type: fixed
        width: @PANEL_TAB_WIDTH@
        hcount: @PANEL_TAB_COUNT@
        vcount: @PANEL_TAB_COUNT@
      cuts:
        # JLCPCB: 0.5 mm holes, 0.8 mm pitch, slightly inside the board
        type: mousebites
        drill: 0.5
        spacing: 0.8
        offset: 0.2
        prolong: 0.5
      framing:
        # Rails on top and bottom: JLCPCB needs >= 5 mm for the assembly
        type: railstb
        width: @PANEL_RAIL_WIDTH@
        space: @PANEL_SPACE@
        # JLCPCB Standard PCBA: 70 x 70 mm minimum
        mintotalheight: @PANEL_MIN_SIZE@
        mintotalwidth: @PANEL_MIN_SIZE@
      tooling:
        # JLCPCB tooling holes (KiKit jlcTooling preset), centered in the rails
        type: 3hole
        hoffset: 2.5
        voffset: 2.5
        size: 1.152
        soldermaskmargin: 1.3
      fiducials:
        type: 3fid
        hoffset: 6
        voffset: 2.5
        coppersize: 1
        opening: 2
      text:
        type: simple
        text: '${BOARD_NAME} rev ${REVISION}'
        anchor: mt
        voffset: 2.5
        width: 1.2
        height: 1.2
        thickness: 0.2
        layer: F.SilkS
      post:
        # Inner corners rounded like the 1 mm router bit
        millradius: 1
        origin: bl

...
definitions:
  NAME: panel
  COMMENT: Panel for JLCPCB (mousebites)
  DIR: Manufacturing/Panel
  PANEL_ROWS: 2
  PANEL_COLS: 2
  PANEL_SPACE: 2
  PANEL_TAB_WIDTH: 3
  PANEL_TAB_COUNT: 2
  PANEL_RAIL_WIDTH: 5
  PANEL_MIN_SIZE: 70
