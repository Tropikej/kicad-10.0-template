# KiBot configuration file for the KiCad 10 KiBot template
# Heavily inspired by https://github.com/nguyen-v/KDT_Hierarchical_KiBot
# KiCad 10.0 / KiBot 1.9
#
# All user-tunable parameters are in the `definitions:` section at the end of
# this file. Any definition can also be overridden from the command line with
# `-E NAME=value` (kibot_launch.sh does it for REVISION and RENDER_ENGINE).

kibot:
  version: 1

variants:

  # Project status variants ====================================================
  # They select which outputs are generated (see kibot_launch.sh):
  #   DRAFT       : schematic in progress -> schematic PDF, netlist, BoM
  #   PRELIMINARY : schematic + PCB documents, no ERC/DRC
  #   CHECKED     : schematic + PCB documents, with ERC/DRC
  #   RELEASED    : same as CHECKED, automatically selected on a release tag

  - name: 'DRAFT'
    comment: "Very early stage of schematic, ignore details."
    type: kibom
    variant: DRAFT
    exclude_filter: '_null'

  - name: 'PRELIMINARY'
    comment: "Close to final schematic."
    type: kibom
    variant: PRELIMINARY
    exclude_filter: '_null'

  - name: 'CHECKED'
    comment: "There shouldn't be any mistakes. Contact the engineer if you find any."
    type: kibom
    variant: CHECKED
    exclude_filter: '_null'

  - name: 'RELEASED'
    comment: "A board with this schematic has been sent to production."
    type: kibom
    variant: RELEASED
    exclude_filter: '_null'

  # Assembly variants: KiCad 10 variants (Schematic Setup > Variants, then the
  # per-variant DNP / fields of the symbols). KiBot imports them from the
  # project, nothing to declare here. List them in `assembly_variants` of
  # kibot_settings.yaml, or run one with `./run_kibot.sh -v NAME`: same outputs
  # as RELEASED, in Variants/<name>, files suffixed with _<name>.

  # Assembly variant selected by kibot_launch.sh (-E ASSEMBLY_VARIANT=NAME,
  # comment = its description in the project). KiBot checks the variant given
  # on the command line before importing the project variants: it must be
  # declared here. Not used by the status variants.
  - name: '@ASSEMBLY_VARIANT@'
    comment: '@ASSEMBLY_VARIANT_COMMENT@'
    type: kicad
    file_id: '_@ASSEMBLY_VARIANT@'

groups:

  # Everything generated for PRELIMINARY / CHECKED / RELEASED
  - name: all_group
    outputs:
      - @NETLIST_OUTPUT@
      - bom
      - 3d
      - fab
      - assembly
      - pdf_docs
      - jlcpcb
      - @MD_README_OUTPUT@
      # - @HTML_KICANVAS_OUTPUT@ # Very experimental, excluded for now
      - @HTML_KIRI_OUTPUT@
      - @HTML_NAV_RES_OUTPUT@

  # Generated for the assembly variants (kibot_launch.sh -v NAME): what
  # changes with the fitted parts. Gerbers, fabrication documents, KiRI and
  # README are the same as the main run.
  - name: variant_group
    outputs:
      - @NETLIST_OUTPUT@
      - bom
      - 3d
      - assembly
      - @PDF_SCHEMATIC_OUTPUT@
      - jlcpcb

  # Panel (kibot_launch.sh, `panel: true` in kibot_settings.yaml)
  - name: panel_group
    outputs:
      - panel

  # Generated for DRAFT
  - name: draft_group
    outputs:
      - @NETLIST_OUTPUT@
      - @PDF_SCHEMATIC_OUTPUT@
      - @CSV_BOM_OUTPUT@
      - @HTML_BOM_OUTPUT@

  # JLCPCB fabrication and assembly files (KiBot JLCPCB template)
  - name: jlcpcb
    outputs:
      - _JLCPCB
      - _JLCPCB_compress

  # Human readable PDF documents
  - name: pdf_docs
    outputs:
      - @PDF_SCHEMATIC_OUTPUT@
      - @PDF_PCB_ROUTING_OUTPUT@
      - @PDF_GERBERS_OUTPUT@

  - name: fab
    outputs:
      - tables
      - @GERBER_OUTPUT@
      - @ODB_OUTPUT@
      - @EXCELLON_DRILL_OUTPUT@
      # - @DXF_DRILL_MAP_OUTPUT@
      - @PDF_DRILL_MAP_OUTPUT@
      - @PDF_FABRICATION_OUTPUT@
      - @ZIP_COMPRESS_FAB_OUTPUT@

  - name: assembly
    outputs:
      - 3d_render
      - @CSV_POS_OUTPUT@
      - @PDF_ASSEMBLY_OUTPUT@

  # 3D renders. Same output names for both render engines (RENDER_ENGINE),
  # so the documents embedding them don't need to change.
  - name: 3d_render
    outputs:
      - @PNG_3D_VIEWER_TOP@
      - @PNG_3D_VIEWER_BOTTOM@
      - @PNG_3D_VIEWER_ANGLED_TOP@
      - @PNG_3D_VIEWER_ANGLED_BOTTOM@

  - name: bom
    outputs:
      - @CSV_BOM_OUTPUT@
      # - @XLSX_BOM_OUTPUT@ # Needs KiCost API keys, use ./kibot_launch.sh --costs
      - @HTML_IBOM_OUTPUT@
      - @HTML_BOM_OUTPUT@

  - name: tables
    outputs:
      - @CSV_COMP_COUNT_OUPUT@
      - @CSV_IMPEDANCE_TABLE_OUTPUT@
      - @CSV_DRILL_TABLE_OUTPUT@
      - testpoints
      - notes

  - name: testpoints
    outputs:
      - @CSV_TP_OUTPUT@
      - @CSV_TP_TOP_OUTPUT@
      - @CSV_TP_BOTTOM_OUTPUT@

  - name: notes
    outputs:
      - @TXT_FAB_NOTES_OUTPUT@
      - @TXT_ASSEMBLY_NOTES_OUTPUT@

  - name: 3d
    outputs:
      - @STEP_OUTPUT@

import:

  # Global parameters ==========================================================

  - file: kibot_globals.yaml
    definitions:
      OUTPUT_DIR: @OUTPUT_DIR@
      LAYER_DNP_TOP: @LAYER_DNP_TOP@
      LAYER_DNP_BOTTOM: @LAYER_DNP_BOTTOM@

  # Filters ====================================================================

  - file: kibot_filt_field_rename.yaml
    definitions:
      NAME: @FILT_FIELD_RENAME@
      COMMENT: Rename fields
      MPN_FIELD: @MPN_FIELD@
      MAN_FIELD: @MAN_FIELD@

  - file: kibot_filt_testpoints.yaml
    definitions:
      NAME: @FILT_TP_ONLY@
      COMMENT: Include only testpoints

  - file: kibot_filt_exclude_testpoints.yaml
    definitions:
      NAME: @FILT_TP_EXCLUDE@
      COMMENT: Exclude only testpoints

  - file: kibot_filt_testpoints.yaml
    definitions:
      NAME: @FILT_TP_TOP_ONLY@
      COMMENT: Select only top testpoints
      EXCLUDE_BOTTOM: true
      EXCLUDE_REFS: "@EXCLUDE_REFS@"

  - file: kibot_filt_testpoints.yaml
    definitions:
      NAME: @FILT_TP_BOTTOM_ONLY@
      COMMENT: Select only bottom testpoints
      EXCLUDE_TOP: true
      EXCLUDE_REFS: "@EXCLUDE_REFS@"

  # Preflights =================================================================

  # Set text variables
  - file: kibot_pre_set_text_variables.yaml
    definitions:
      PROJECT_NAME: @PROJECT_NAME@
      BOARD_NAME: @BOARD_NAME@
      COMPANY: @COMPANY@
      DESIGNER: @DESIGNER@
      GIT_URL: @GIT_URL@
      REVISION: @REVISION@
      SCRIPTS_DIR: @SCRIPTS_DIR@
      FABRICATION_DIR: @FABRICATION_DIR@
      ASSEMBLY_DIR: @ASSEMBLY_DIR@
      OUTPUT_ROOT: @OUTPUT_ROOT@

  # Generate ERC Report
  - file: kibot_pre_erc_report.yaml
    definitions:
      DIR: @REPORT_DIR@

  # Generate DRC Report
  - file: kibot_pre_drc_report.yaml
    definitions:
      CHECK_ZONE_FILLS: @CHECK_ZONE_FILLS@
      DIR: @REPORT_DIR@

  # Draw stackup table in PCB. Needs gerber output
  - file: kibot_pre_draw_stackup.yaml
    definitions:
      GERBER_OUTPUT: @GERBER_OUTPUT@
      NOTE: @STACKUP_TABLE_NOTE@

# Generated outputs ============================================================

  # JLCPCB -----------------------------------------------------------------------
  # Gerbers + drill (ZIP), BoM with LCSC part numbers and pick and place with
  # the JLCPCB rotation corrections. Parts need an `LCSC` field (C123456) to
  # be in the BoM. Template provided by KiBot, selected by JLCPCB_TEMPLATE.
  - file: @JLCPCB_TEMPLATE@
    definitions:
      _KIBOT_MANF_DIR: '@JLCPCB_DIR@'
      _KIBOT_MANF_DIR_COMP: '@JLCPCB_DIR@'
      _KIBOT_COMPRESS_MOVE: true
      _KIBOT_DRILL_AUX_ORIGIN: false
      _KIBOT_PLOT_FOOTPRINT_REFS: @PLOT_REFS@

  # Panel (KiKit), when `panel: true` in kibot_settings.yaml. The launcher
  # then plots it with kibot_panel.yaml (Gerbers, drill, ZIP)
  - file: kibot_out_panelize_@PANEL_CUTS@.yaml
    definitions:
      NAME: panel
      COMMENT: Panel for JLCPCB (@PANEL_CUTS@)
      DIR: '@PANEL_DIR@'
      PANEL_ROWS: @PANEL_ROWS@
      PANEL_COLS: @PANEL_COLS@
      PANEL_SPACE: @PANEL_SPACE@
      PANEL_TAB_WIDTH: @PANEL_TAB_WIDTH@
      PANEL_TAB_COUNT: @PANEL_TAB_COUNT@
      PANEL_RAIL_WIDTH: @PANEL_RAIL_WIDTH@
      PANEL_MIN_SIZE: @PANEL_MIN_SIZE@

  # Netlist --------------------------------------------------------------------
  - file: kibot_out_netlist.yaml
    definitions:
      NAME: @NETLIST_OUTPUT@
      COMMENT: Schematic netlist in KiCad format

  # Generic manufacturing outputs ==============================================

  # Gerbers --------------------------------------------------------------------
  - file: kibot_out_gerber.yaml
    definitions:
      NAME: @GERBER_OUTPUT@
      COMMENT: Gerbers in GBR format
      DIR: @GERBERS_DIR@
      PLOT_REFS: @PLOT_REFS@

  # ODB++ ----------------------------------------------------------------------
  - file: kibot_out_odb.yaml
    definitions:
      NAME: @ODB_OUTPUT@
      COMMENT: ODB++ in ZIP format
      DIR: @FABRICATION_DIR@

  # Drill files
  - file: kibot_out_excellon_drill.yaml
    definitions:
      NAME: @EXCELLON_DRILL_OUTPUT@
      COMMENT: Drill in Excellon format
      DIR: @GERBERS_DIR@

  # Drill Map (PDF)
  - file: kibot_out_excellon_drill.yaml
    definitions:
      NAME: @PDF_DRILL_MAP_OUTPUT@
      COMMENT: Drill Map in PDF format
      DIR: @GERBERS_DIR@
      GENERATE_DRILL: false
      PTH_NPTH: @GROUP_PTH_NPTH_DRL@
      MAP_FORMAT: pdf

  # Drill Map (DXF)
  # - file: kibot_out_excellon_drill.yaml
  #   definitions:
  #     NAME: @DXF_DRILL_MAP_OUTPUT@
  #     COMMENT: Drill Map in DXF format
  #     DIR: @GERBERS_DIR@
  #     GENERATE_DRILL: false
  #     PTH_NPTH: @GROUP_PTH_NPTH_DRL@
  #     MAP_FORMAT: dxf

  # Drill Table (CSV)
  - file: kibot_out_csv_drill_table.yaml
    definitions:
      NAME: @CSV_DRILL_TABLE_OUTPUT@
      COMMENT: Drill Table in CSV format
      DIR: @FAB_DRILL_TABLES_DIR@
      PTH_NPTH: '@GROUP_PTH_NPTH@'
      GROUP_ROUND_SLOTS: @GROUP_ROUND_SLOTS@

  # Position file --------------------------------------------------------------
  - file: kibot_out_csv_pos.yaml
    definitions:
      NAME: @CSV_POS_OUTPUT@
      COMMENT: Position file in CSV format
      DIR: @ASSEMBLY_DIR@

  # Testpoint lists ------------------------------------------------------------
  - file: kibot_out_csv_testpoints.yaml
    definitions:
      NAME: @CSV_TP_OUTPUT@
      COMMENT: Testpoint report in CSV format
      DIR: @TESTPOINTS_DIR@
      EXCLUDE_FILTER: @FILT_TP_ONLY@

  - file: kibot_out_csv_testpoints_simple.yaml
    definitions:
      NAME: @CSV_TP_TOP_OUTPUT@
      COMMENT: Top testpoint report in CSV format
      DIR: @TESTPOINTS_DIR@
      SUFFIX: -top
      EXCLUDE_FILTER: @FILT_TP_TOP_ONLY@

  - file: kibot_out_csv_testpoints_simple.yaml
    definitions:
      NAME: @CSV_TP_BOTTOM_OUTPUT@
      COMMENT: Bottom testpoint report in CSV format
      DIR: @TESTPOINTS_DIR@
      SUFFIX: -bottom
      EXCLUDE_FILTER: @FILT_TP_BOTTOM_ONLY@

  # Bill of Materials (BoM) ----------------------------------------------------
  - file: kibot_out_csv_bom.yaml
    definitions:
      NAME: @CSV_BOM_OUTPUT@
      COMMENT: Bill of Materials in CSV format
      DIR: @ASSEMBLY_DIR@
      MPN_FIELD: @MPN_FIELD@
      MAN_FIELD: @MAN_FIELD@

  - file: kibot_out_html_bom.yaml
    definitions:
      NAME: @HTML_BOM_OUTPUT@
      COMMENT: Bill of Materials in HTML format
      DIR: @ASSEMBLY_DIR@
      MPN_FIELD: @MPN_FIELD@
      MAN_FIELD: @MAN_FIELD@

  # XLSX Bill of Materials with costs (KiCost)
  - file: kibot_out_xlsx_bom.yaml
    definitions:
      NAME: @XLSX_BOM_OUTPUT@
      COMMENT: Bill of Materials in XLSX format
      DIR: @ASSEMBLY_DIR@
      FILT_PRE_TRANSFORM: @FILT_FIELD_RENAME@

  # Interactive HTML BOM. Needs netlist.
  - file: kibot_out_html_ibom.yaml
    definitions:
      NAME: @HTML_IBOM_OUTPUT@
      COMMENT: Interactive BOM in HTML format
      DIR: @ASSEMBLY_DIR@
      EXCLUDE_FILTER: @FILT_TP_EXCLUDE@
      TITLE: @BOARD_NAME@ Assembly
      MPN_FIELD: @MPN_FIELD@

  # CSV components count report ------------------------------------------------
  - file: kibot_out_csv_report.yaml
    definitions:
      NAME: @CSV_COMP_COUNT_OUPUT@
      COMMENT: Component report (count) in CSV format
      DIR: @ASSEMBLY_DIR@
      OUTPUT_ID: components_count
      TEMPLATE: total_components

  # CSV Impedance/Transmission line table
  - file: kibot_out_csv_report.yaml
    definitions:
      NAME: @CSV_IMPEDANCE_TABLE_OUTPUT@
      COMMENT: Impedance table in CSV format
      DIR: @FABRICATION_DIR@
      OUTPUT_ID: impedance_table
      TEMPLATE: @REPORT_TEMPLATE_DIR@/impedance_table.txt

  # TXT fabrication notes ------------------------------------------------------
  - file: kibot_out_txt_report.yaml
    definitions:
      NAME: @TXT_FAB_NOTES_OUTPUT@
      COMMENT: Fabrication notes in TXT format
      DIR: @FABRICATION_DIR@
      OUTPUT_ID: fabrication_notes
      TEMPLATE: @REPORT_TEMPLATE_DIR@/fabrication_notes.txt

  # TXT assembly notes
  - file: kibot_out_txt_report.yaml
    definitions:
      NAME: @TXT_ASSEMBLY_NOTES_OUTPUT@
      COMMENT: Assembly notes in TXT format
      DIR: @ASSEMBLY_DIR@
      OUTPUT_ID: assembly_notes
      TEMPLATE: @REPORT_TEMPLATE_DIR@/assembly_notes.txt

  # PNG 3D renders -------------------------------------------------------------
  # The engine is selected with RENDER_ENGINE (kicad | blender), it picks
  # kibot_out_png_3d_kicad.yaml or kibot_out_png_3d_blender.yaml
  - file: kibot_out_png_3d_@RENDER_ENGINE@.yaml
    definitions:
      NAME: @PNG_3D_VIEWER_TOP@
      COMMENT: Top 3D PCB render in PNG format (@RENDER_ENGINE@)
      DIR: @IMAGES_DIR@
      SUFFIX: top
      VIEW: top
      RESOLUTION: @3D_RESOLUTION@
      RAYTRACING: @KICAD_3D_RAYTRACING@
      BLENDER_SAMPLES: @BLENDER_SAMPLES@
      PCB3D_OUTPUT: @PCB3D_OUTPUT@

  - file: kibot_out_png_3d_@RENDER_ENGINE@.yaml
    definitions:
      NAME: @PNG_3D_VIEWER_BOTTOM@
      COMMENT: Bottom 3D PCB render in PNG format (@RENDER_ENGINE@)
      DIR: @IMAGES_DIR@
      SUFFIX: bottom
      VIEW: bottom
      RESOLUTION: @3D_RESOLUTION@
      RAYTRACING: @KICAD_3D_RAYTRACING@
      BLENDER_SAMPLES: @BLENDER_SAMPLES@
      PCB3D_OUTPUT: @PCB3D_OUTPUT@

  - file: kibot_out_png_3d_@RENDER_ENGINE@.yaml
    definitions:
      NAME: @PNG_3D_VIEWER_ANGLED_TOP@
      COMMENT: Top (angled) 3D PCB render in PNG format (@RENDER_ENGINE@)
      DIR: @IMAGES_DIR@
      SUFFIX: angled_top
      VIEW: top
      KICAD_ROT_X: @KICAD_3D_ROT_X@
      KICAD_ROT_Y: @KICAD_3D_ROT_Y@
      BLENDER_ROT_X: @BLENDER_3D_ROT_X@
      BLENDER_ROT_Y: @BLENDER_3D_ROT_Y@
      BLENDER_ROT_Z: @BLENDER_3D_ROT_Z@
      RESOLUTION: @3D_RESOLUTION@
      RAYTRACING: @KICAD_3D_RAYTRACING@
      BLENDER_SAMPLES: @BLENDER_SAMPLES@
      PCB3D_OUTPUT: @PCB3D_OUTPUT@

  - file: kibot_out_png_3d_@RENDER_ENGINE@.yaml
    definitions:
      NAME: @PNG_3D_VIEWER_ANGLED_BOTTOM@
      COMMENT: Bottom (angled) 3D PCB render in PNG format (@RENDER_ENGINE@)
      DIR: @IMAGES_DIR@
      SUFFIX: angled_bottom
      VIEW: bottom
      KICAD_ROT_X: @KICAD_3D_ROT_X@
      KICAD_ROT_Y: @KICAD_3D_ROT_Y@
      BLENDER_ROT_X: @BLENDER_3D_ROT_X@
      BLENDER_ROT_Y: @BLENDER_3D_ROT_Y@
      BLENDER_ROT_Z: @BLENDER_3D_ROT_Z_BOTTOM@
      RESOLUTION: @3D_RESOLUTION@
      RAYTRACING: @KICAD_3D_RAYTRACING@
      BLENDER_SAMPLES: @BLENDER_SAMPLES@
      PCB3D_OUTPUT: @PCB3D_OUTPUT@

  # PCB3D export for the Blender renders (only generated when needed)
  - file: kibot_out_pcb3d.yaml
    definitions:
      NAME: @PCB3D_OUTPUT@
      COMMENT: PCB 3D model in PCB3D (Blender) format
      DIR: @3D_DIR@

  # STEP file ------------------------------------------------------------------
  - file: kibot_out_step.yaml
    definitions:
      NAME: @STEP_OUTPUT@
      COMMENT: PCB 3D model in STEP format
      DIR: @3D_DIR@

  # Schematic in PDF format ----------------------------------------------------
  - file: kibot_out_pdf_schematic.yaml
    definitions:
      NAME: @PDF_SCHEMATIC_OUTPUT@
      COMMENT: Schematic in PDF format
      COLOR_THEME: @COLOR_THEME@
      DIR: @SCHEMATIC_DIR@
      DEFAULT_FONT: 'Times New Roman'

  # PCB routing (copper layers) in PDF format ----------------------------------
  - file: kibot_out_pdf_pcb_routing.yaml
    definitions:
      NAME: @PDF_PCB_ROUTING_OUTPUT@
      COMMENT: PCB routing (copper layers) in PDF format
      DIR: @PCB_DIR@
      COLOR_THEME: @COLOR_THEME@
      SHEET_WKS: @SHEET_WKS@
      SCALING: @ROUTING_SCALING@

  # Gerbers in PDF format (one page per fabrication layer) --------------------
  - file: kibot_out_pdf_gerbers.yaml
    definitions:
      NAME: @PDF_GERBERS_OUTPUT@
      COMMENT: Gerber layers in PDF format
      DIR: @FABRICATION_DIR@
      SHEET_WKS: @SHEET_WKS@
      COLOR_THEME: @COLOR_THEME@
      MONOCHROME: @GERBERS_PDF_MONOCHROME@
      SCALING: @GERBERS_PDF_SCALING@

  # Fabrication Document in PDF format
  - file: kibot_out_pdf_fabrication.yaml
    definitions:
      NAME: @PDF_FABRICATION_OUTPUT@
      COMMENT: Fabrication document in PDF format
      DIR: @FABRICATION_DIR@
      COLOR_THEME: @COLOR_THEME@
      SHEET_WKS: @SHEET_WKS@
      SCALING: @FAB_SCALING@
      PTH_NPTH: '@GROUP_PTH_NPTH@'
      GROUP_ROUND_SLOTS: @GROUP_ROUND_SLOTS@
      FAB_EXCLUDE_FILTER: @FILT_TP_ONLY@
      LAYER_DRILL_MAP: @LAYER_DRILL_MAP@
      LAYER_TP_LIST_TOP: @LAYER_TP_LIST_TOP@
      LAYER_TP_LIST_BOTTOM: @LAYER_TP_LIST_BOTTOM@
      NAME_TP_TOP: @CSV_TP_TOP_OUTPUT@
      NAME_TP_BOTTOM: @CSV_TP_BOTTOM_OUTPUT@
      NAME_IMPEDANCE_TABLE: @CSV_IMPEDANCE_TABLE_OUTPUT@
      NAME_DRILL_TABLE: @CSV_DRILL_TABLE_OUTPUT@

  # Assembly Document in PDF format
  - file: kibot_out_pdf_assembly.yaml
    definitions:
      NAME: @PDF_ASSEMBLY_OUTPUT@
      COMMENT: Assembly document in PDF format
      DIR: @ASSEMBLY_DIR@
      COLOR_THEME: @COLOR_THEME@
      SHEET_WKS: @SHEET_WKS@
      SCALING: @ASSEMBLY_SCALING@
      FAB_EXCLUDE_FILTER: @FILT_TP_EXCLUDE@
      LAYER_TITLE_PAGE: @LAYER_TITLE_PAGE@
      LAYER_ASSEMBLY_TEXT_TOP: @LAYER_ASSEMBLY_TEXT_TOP@
      LAYER_ASSEMBLY_TEXT_BOTTOM: @LAYER_ASSEMBLY_TEXT_BOTTOM@
      LAYER_DNP_CROSS_TOP: @LAYER_DNP_CROSS_TOP@
      LAYER_DNP_CROSS_BOTTOM: @LAYER_DNP_CROSS_BOTTOM@
      NAME_COMP_COUNT: @CSV_COMP_COUNT_OUPUT@

  # Compress fabrication files into ZIP archive --------------------------------
  - file: kibot_out_compress_fab.yaml
    definitions:
      NAME: @ZIP_COMPRESS_FAB_OUTPUT@
      COMMENT: Generates a ZIP file with gerbers, drill and fabrication document
      DIR: @FABRICATION_DIR@
      GERBER_OUTPUT: @GERBER_OUTPUT@
      DRILL_MAP_OUTPUT: @PDF_DRILL_MAP_OUTPUT@
      DRILL_OUTPUT: @EXCELLON_DRILL_OUTPUT@
      FABRICATION_OUTPUT: @PDF_FABRICATION_OUTPUT@

  # Generate webpage for exploring PCB/SCH files
  - file: kibot_out_html_kicanvas.yaml
    definitions:
      NAME: @HTML_KICANVAS_OUTPUT@
      COMMENT: KiCanvas webpage
      DIR: KiCanvas

  # Generate webpage with diffs between commits
  - file: kibot_out_html_kiri.yaml
    definitions:
      NAME: @HTML_KIRI_OUTPUT@
      COMMENT: KiRI webpage
      DIR: KiRI
      MAX_COMMITS: @KIRI_MAX_COMMITS@

  # README.md file generation
  - file: kibot_out_md_report.yaml
    definitions:
      NAME: @MD_README_OUTPUT@
      COMMENT: README file in Markdown format
      DIR: @OUTPUT_DIR@
      CATEGORY: '.'
      OUTPUT_NAME: README
      TEMPLATE: @REPORT_TEMPLATE_DIR@/readme.txt

  - file: kibot_out_navigate_results.yaml
    definitions:
      NAME: @HTML_NAV_RES_OUTPUT@
      COMMENT: Results webpage in HTML format
      DIR: HTML
      TITLE: @BOARD_NAME@
      LOGO: @LOGO@
      LOGO_URL: @GIT_URL@

# ==============================================================================

...
definitions:

  # Metadata ===================================================================

  PROJECT_NAME: Project Name
  BOARD_NAME: Board Name

  COMPANY: Company Name
  DESIGNER: Author

  LOGO: 'Logos/dummy_logo.png'
  # auto: URL of the git remote (origin), or set it explicitly
  GIT_URL: auto

  # Revision. Normally overridden by kibot_launch.sh (-E REVISION=...), which
  # computes it from CHANGELOG.md or from the git tag in CI.
  REVISION: ''

  # Preflight ==================================================================

  CHECK_ZONE_FILLS: false
  STACKUP_TABLE_NOTE: external layer thicknesses are specified after plating

  # BoM ========================================================================

  MPN_FIELD: 'Manufacturer Part Number'
  MAN_FIELD: 'Manufacturer'

  # Drill table and drill map parameters =======================================

  GROUP_ROUND_SLOTS: true  # whether or not to group round holes and slots
  GROUP_PTH_NPTH: 'no'  # for drill tables (CSV, PCB Print)
  GROUP_PTH_NPTH_DRL: false  # for .drl files

  # Gerber parameters ==========================================================

  PLOT_REFS: true # reference designators

  # PDF documents parameters ===================================================

  COLOR_THEME: Altium_Theme
  SHEET_WKS: ${KIPRJMOD}/Templates/Template_PCB_GIT_A4.kicad_wks
  FAB_SCALING: 1
  ASSEMBLY_SCALING: 1
  ROUTING_SCALING: 0      # PCB routing PDF, 0 = fit the page
  GERBERS_PDF_SCALING: 0  # Gerbers PDF, 0 = fit the page
  GERBERS_PDF_MONOCHROME: false  # Gerbers PDF in gray scale instead of colors

  # References to exclude from testpoint highlighting ==========================

  EXCLUDE_REFS: '[MB*]' # for components on the PCB but not on the schematic

  # Output folder (-d) of the run, set by kibot_launch.sh: the notes are read
  # back from it (Variants/<name> for the assembly variants)
  OUTPUT_ROOT: .

  # Assembly variant (set by kibot_launch.sh -v NAME, see `variants:`).
  # Placeholder otherwise: not `Default`, KiBot uses the `Default` KiCad
  # variant for the outputs without variant.
  ASSEMBLY_VARIANT: NO_ASSEMBLY_VARIANT
  ASSEMBLY_VARIANT_COMMENT: Unused

  # 3D renders =================================================================

  # Render engine used for the PNG previews:
  #   kicad   : KiCad 3D viewer (kicad-cli pcb render), fast
  #   blender : photo-realistic render with Blender + pcb2blender, slow
  # Override from the command line with: ./kibot_launch.sh --render blender
  RENDER_ENGINE: kicad

  3D_RESOLUTION: 2000        # Image width/height in pixels

  # KiCad engine: ray tracing is nicer but adds a floor shadow around the board
  KICAD_3D_RAYTRACING: false

  # Angled views, KiCad engine, in degrees. Avoid Z rotations here: the
  # KiCad renderer can't zoom out, a rotated board would be clipped
  KICAD_3D_ROT_X: -30
  KICAD_3D_ROT_Y: -20

  # Angled views, Blender engine, in degrees
  BLENDER_3D_ROT_X: 20
  BLENDER_3D_ROT_Y: -10
  BLENDER_3D_ROT_Z: 10
  BLENDER_3D_ROT_Z_BOTTOM: -10
  BLENDER_SAMPLES: 50        # Blender engine only: 10 = draft, 100+ = final

  # JLCPCB =====================================================================

  # JLCPCB: SMD only assembly, JLCPCB_with_THT: SMD + through hole assembly
  # (also available: JLCPCB_stencil, JLCPCB_stencil_with_THT)
  JLCPCB_TEMPLATE: JLCPCB

  # Panel (KiKit) ==============================================================
  # Generated when `panel: true` in kibot_settings.yaml, in PANEL_DIR:
  # panel PCB, preview, Gerbers + drill ZIP to order it at JLCPCB (panel by
  # customer). Rails top/bottom with tooling holes and fiducials, board title
  # and revision on the top rail.
  PANEL_CUTS: mousebites     # mousebites (any shape) | vcuts (rectangles only)
  PANEL_ROWS: 2
  PANEL_COLS: 2
  PANEL_SPACE: 2             # mm between boards (mousebites only)
  PANEL_TAB_WIDTH: 3         # mm (mousebites only)
  PANEL_TAB_COUNT: 2         # tabs per board edge (mousebites only)
  PANEL_RAIL_WIDTH: 5        # mm, JLCPCB assembly needs >= 5
  PANEL_MIN_SIZE: 70         # mm, JLCPCB Standard PCBA minimum (0: none)

  # KiRI (visual diff between commits) =========================================

  KIRI_MAX_COMMITS: 5

  # Output directories =========================================================

  # Root
  OUTPUT_DIR: ./

  # Relative to root
  REPORT_DIR: Reports
  SCHEMATIC_DIR: Schematic
  PCB_DIR: PCB
  MANUFACTURING_DIR: Manufacturing
  ASSEMBLY_DIR: '@MANUFACTURING_DIR@/Assembly'
  FABRICATION_DIR: '@MANUFACTURING_DIR@/Fabrication'
  GERBERS_DIR: '@FABRICATION_DIR@/Gerbers'
  JLCPCB_DIR: '@MANUFACTURING_DIR@/JLCPCB'
  PANEL_DIR: '@MANUFACTURING_DIR@/Panel'
  FAB_DRILL_TABLES_DIR: '@FABRICATION_DIR@/Drill Tables'
  TESTING_DIR: Testing
  TESTPOINTS_DIR: '@TESTING_DIR@/Testpoints'
  IMAGES_DIR: Images
  3D_DIR: 3D
  RESOURCES_DIR: kibot_resources
  REPORT_TEMPLATE_DIR: '@RESOURCES_DIR@/templates'
  SCRIPTS_DIR: '@RESOURCES_DIR@/scripts'

  # Layer names. Should match user-defined names in the PCB.  ==================

  LAYER_TITLE_PAGE: TitlePage
  LAYER_DNP_TOP: F.DNP
  LAYER_DNP_BOTTOM: B.DNP
  LAYER_DRILL_MAP: DrillMap
  LAYER_TP_LIST_TOP: F.TestPointList
  LAYER_TP_LIST_BOTTOM: B.TestPointList
  LAYER_ASSEMBLY_TEXT_TOP: F.AssemblyText
  LAYER_ASSEMBLY_TEXT_BOTTOM: B.AssemblyText
  LAYER_DNP_CROSS_TOP: F.DNP
  LAYER_DNP_CROSS_BOTTOM: B.DNP

  # Filters names ==============================================================

  FILT_FIELD_RENAME: field_rename
  FILT_TP_ONLY: only_testpoints
  FILT_TP_EXCLUDE: exclude_testpoints
  FILT_TP_TOP_ONLY: only_testpoints_top
  FILT_TP_BOTTOM_ONLY: only_testpoints_bottom

  # Output names ===============================================================
  # Used as `kibot_image_<name>` / `kibot_table_<name>` in PCB groups

  NETLIST_OUTPUT: netlist

  GERBER_OUTPUT: gbr_gerbers
  ODB_OUTPUT: zip_odb
  EXCELLON_DRILL_OUTPUT: drl_excellon
  PDF_DRILL_MAP_OUTPUT: pdf_drill_map
  DXF_DRILL_MAP_OUTPUT: dxf_drill_map
  CSV_DRILL_TABLE_OUTPUT: csv_drill_table
  CSV_POS_OUTPUT: csv_position

  CSV_TP_OUTPUT: csv_testpoints
  CSV_TP_TOP_OUTPUT: csv_testpoints_top
  CSV_TP_BOTTOM_OUTPUT: csv_testpoints_bottom

  CSV_BOM_OUTPUT: csv_bom
  XLSX_BOM_OUTPUT: xlsx_bom
  HTML_IBOM_OUTPUT: html_bom_interactive
  HTML_BOM_OUTPUT: html_bom
  CSV_COMP_COUNT_OUPUT: csv_comp_count
  CSV_IMPEDANCE_TABLE_OUTPUT: csv_impedance_table

  TXT_FAB_NOTES_OUTPUT: txt_fabrication_notes
  TXT_ASSEMBLY_NOTES_OUTPUT: txt_assembly_notes

  PNG_3D_VIEWER_TOP: png_3d_viewer_top
  PNG_3D_VIEWER_BOTTOM: png_3d_viewer_bottom
  PNG_3D_VIEWER_ANGLED_TOP: png_3d_viewer_angled_top
  PNG_3D_VIEWER_ANGLED_BOTTOM: png_3d_viewer_angled_bottom

  STEP_OUTPUT: step
  PCB3D_OUTPUT: pcb3d_blender

  PDF_SCHEMATIC_OUTPUT: pdf_schematic
  PDF_PCB_ROUTING_OUTPUT: pdf_pcb_routing
  PDF_GERBERS_OUTPUT: pdf_gerbers
  PDF_FABRICATION_OUTPUT: pdf_fabrication
  PDF_ASSEMBLY_OUTPUT: pdf_assembly

  ZIP_COMPRESS_FAB_OUTPUT: zip_compress_fab

  HTML_KICANVAS_OUTPUT: html_kicanvas
