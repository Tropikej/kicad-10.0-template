# KiBot output: panel of the board with KiKit (vcuts), for JLCPCB
# V-cuts: rectangular boards only, no gap between the boards
# https://kibot.readthedocs.io/en/latest/configuration/outputs/panelize.html
# https://yaqwsx.github.io/KiKit/latest/panelization/cli/

kibot:
  version: 1

outputs:
- name: @NAME@
  comment: '@COMMENT@'
  type: panelize
  category: '@DIR@'
  dir: '@DIR@'
  options:
    output: '%f-panel.%x'
    create_preview: true
    configs:
    - name: 'jlcpcb_vcuts'
      layout:
        type: grid
        rows: @PANEL_ROWS@
        cols: @PANEL_COLS@
        space: 0
      tabs:
        # V-cuts: boards touching, straight cuts across the whole panel
        type: full
      cuts:
        # On Edge.Cuts, as JLCPCB expects (KiKit jlcVcuts preset). Keep the
        # copper 0.4 mm away from the board edges.
        type: vcuts
        layer: Edge.Cuts
        clearance: 0.4
      framing:
        # Rails on top and bottom: JLCPCB needs >= 5 mm for the assembly
        type: railstb
        width: @PANEL_RAIL_WIDTH@
        space: 0
        # JLCPCB Standard PCBA: 70 x 70 mm minimum
        mintotalheight: @PANEL_MIN_SIZE@
        mintotalwidth: @PANEL_MIN_SIZE@
      tooling:
        # JLCPCB tooling holes (KiKit jlcTooling preset), centered in the rails
        type: 3hole
        hoffset: 2.5
        voffset: 2.5
        size: 1.152
        soldermaskmargin: 1.3
      fiducials:
        type: 3fid
        hoffset: 6
        voffset: 2.5
        coppersize: 1
        opening: 2
      text:
        type: simple
        text: '${BOARD_NAME} rev ${REVISION}'
        anchor: mt
        voffset: 2.5
        width: 1.2
        height: 1.2
        thickness: 0.2
        layer: F.SilkS
      post:
        # Inner corners rounded like the 1 mm router bit
        millradius: 1
        origin: bl

...
definitions:
  NAME: panel
  COMMENT: Panel for JLCPCB (vcuts)
  DIR: Manufacturing/Panel
  PANEL_ROWS: 2
  PANEL_COLS: 2
  PANEL_SPACE: 2
  PANEL_TAB_WIDTH: 3
  PANEL_TAB_COUNT: 2
  PANEL_RAIL_WIDTH: 5
  PANEL_MIN_SIZE: 70
